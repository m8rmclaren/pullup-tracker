name: Pullups
options:
  bundleIdPrefix: com.haydenroszell
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Set to your Apple Developer Team ID for device builds; the Simulator signs locally without one.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  TrackerCore:
    path: TrackerCore
  TrackerStore:
    path: TrackerStore

targets:
  Pullups:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: TrackerCore
        product: TrackerCore
      - package: TrackerStore
        product: TrackerStore
    entitlements:
      path: App/Pullups.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
        com.apple.developer.associated-domains:
          - webcredentials:$(API_DOMAIN)
          - applinks:$(API_DOMAIN)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pull-ups
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        APIBaseURL: $(API_BASE_URL)
        AppGroup: $(APP_GROUP)
        NSAppTransportSecurity:
          # Debug talks to the dev server on http://localhost.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haydenroszell.pullups
        APP_GROUP: group.com.haydenroszell.pullups
        API_DOMAIN: pullups.haydenroszell.com
        API_BASE_URL: https://pullups.haydenroszell.com
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
      configs:
        Debug:
          # npm run dev. The Simulator reaches the Mac's localhost directly.
          API_BASE_URL: http://localhost:5173
