AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  One-time bootstrap for pullup-tracker CI. Lets GitHub Actions on one branch of one repo
  assume a deploy role through OIDC (no stored AWS keys), and creates the Terraform state bucket.

Parameters:
  GitHubOwner:
    Type: String
    Default: m8rmclaren
  GitHubRepo:
    Type: String
    Default: pullup-tracker
  GitHubOwnerId:
    Type: String
    Default: '49427552'
    Description: Numeric owner id. Repos with immutable OIDC subjects send repo:OWNER@OWNER_ID/REPO@REPO_ID.
  GitHubRepoId:
    Type: String
    Default: '1409794570'
    Description: Numeric repo id (gh api repos/OWNER/REPO --jq .id).
  Branch:
    Type: String
    Default: main
  DnsZoneId:
    Type: String
    Default: Z03340042GDCTLVP4F3Z4
    Description: Route 53 hosted zone for the custom domain. Empty skips the DNS and certificate permissions.
  DomainName:
    Type: String
    Default: pullups.haydenroszell.com
    Description: The only name (plus its ACM validation records) the deploy role may change in DnsZoneId.
  Prefix:
    Type: String
    Default: pullups
    Description: Must match the Terraform `name` variable.
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Set to false if this account already has the token.actions.githubusercontent.com provider.

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, 'true']
  HasDomain: !Not [!Equals [!Ref DnsZoneId, '']]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${Prefix}-tfstate-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  # The deploy role can create IAM roles (for the Lambda), which would otherwise let it
  # mint itself any permission. Every role it creates must carry this boundary, which caps
  # it at what the API Lambda actually needs.
  LambdaBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${Prefix}-lambda-boundary'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [s3:GetObject, s3:PutObject]
            Resource: !Sub 'arn:aws:s3:::${Prefix}-data-*/months/*'
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub 'arn:aws:s3:::${Prefix}-data-*'
          - Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub 'arn:aws:ssm:*:${AWS::AccountId}:parameter/${Prefix}/*'
          - Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub 'arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/${Prefix}-*'

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      # Deliberately outside the `${Prefix}-*` namespace it can manage, so it cannot edit itself.
      RoleName: !Sub 'github-deploy-${Prefix}'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # GitHub sends the id-pinned form when the repo uses immutable OIDC subjects (it can't match a deleted-and-recreated repo of the same name); the plain form covers the default.
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:ref:refs/heads/${Branch}'
                  - !Sub 'repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/${Branch}'
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: TerraformState
                Effect: Allow
                Action: [s3:ListBucket, s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !GetAtt StateBucket.Arn
                  - !Sub '${StateBucket.Arn}/*'
              - Sid: AppBuckets
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub 'arn:aws:s3:::${Prefix}-site-*'
                  - !Sub 'arn:aws:s3:::${Prefix}-data-*'
                  - !Sub 'arn:aws:s3:::${Prefix}-site-*/*'
                  - !Sub 'arn:aws:s3:::${Prefix}-data-*/*'
              - Sid: Lambda
                Effect: Allow
                Action: lambda:*
                Resource: !Sub 'arn:aws:lambda:*:${AWS::AccountId}:function:${Prefix}-*'
              - Sid: CloudFront
                Effect: Allow
                Action: cloudfront:*
                Resource: '*'
              - Sid: TokenParameter
                Effect: Allow
                Action: [ssm:PutParameter, ssm:GetParameter, ssm:GetParameters, ssm:DeleteParameter, ssm:AddTagsToResource, ssm:RemoveTagsFromResource, ssm:ListTagsForResource]
                Resource: !Sub 'arn:aws:ssm:*:${AWS::AccountId}:parameter/${Prefix}/*'
              - Sid: DescribeParameters
                Effect: Allow
                Action: ssm:DescribeParameters
                Resource: '*'
              - !If
                - HasDomain
                # RequestCertificate has no resource to scope to; everything after it is limited to us-east-1, where CloudFront needs it.
                - Sid: RequestCertificate
                  Effect: Allow
                  Action: [acm:RequestCertificate, acm:AddTagsToCertificate]
                  Resource: '*'
                - !Ref AWS::NoValue
              - !If
                - HasDomain
                - Sid: ManageCertificates
                  Effect: Allow
                  Action: [acm:DescribeCertificate, acm:DeleteCertificate, acm:ListTagsForCertificate, acm:RemoveTagsFromCertificate]
                  Resource: !Sub 'arn:aws:acm:us-east-1:${AWS::AccountId}:certificate/*'
                - !Ref AWS::NoValue
              - !If
                - HasDomain
                - Sid: ReadDnsZone
                  Effect: Allow
                  Action: [route53:GetHostedZone, route53:ListResourceRecordSets, route53:ListTagsForResource]
                  Resource: !Sub 'arn:aws:route53:::hostedzone/${DnsZoneId}'
                - !Ref AWS::NoValue
              - !If
                - HasDomain
                - Sid: FindDnsZoneAndWaitForChanges
                  Effect: Allow
                  Action: [route53:ListHostedZones, route53:ListHostedZonesByName, route53:GetChange]
                  Resource: '*'
                - !Ref AWS::NoValue
              - !If
                - HasDomain
                # Only the app's own name and its ACM validation records; the rest of the zone stays off limits.
                - Sid: WriteAppRecords
                  Effect: Allow
                  Action: route53:ChangeResourceRecordSets
                  Resource: !Sub 'arn:aws:route53:::hostedzone/${DnsZoneId}'
                  Condition:
                    ForAllValues:StringLike:
                      route53:ChangeResourceRecordSetsNormalizedRecordNames:
                        - !Ref DomainName
                        - !Sub '_*.${DomainName}'
                - !Ref AWS::NoValue
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:DeleteLogGroup, logs:PutRetentionPolicy, logs:DeleteRetentionPolicy, logs:TagResource, logs:UntagResource, logs:ListTagsForResource, logs:TagLogGroup, logs:ListTagsLogGroup]
                Resource: !Sub 'arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/${Prefix}-*'
              - Sid: DescribeLogs
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              - Sid: ReadAppRoles
                Effect: Allow
                Action: [iam:GetRole, iam:GetRolePolicy, iam:ListRolePolicies, iam:ListAttachedRolePolicies, iam:ListInstanceProfilesForRole, iam:DeleteRole, iam:TagRole, iam:UntagRole, iam:UpdateAssumeRolePolicy]
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${Prefix}-*'
              - Sid: WriteAppRolesOnlyWithBoundary
                Effect: Allow
                Action: [iam:CreateRole, iam:PutRolePolicy, iam:DeleteRolePolicy, iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${Prefix}-*'
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref LambdaBoundary
              - Sid: PassAppRoleToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${Prefix}-*'
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

Outputs:
  AwsRoleArn:
    Value: !GetAtt DeployRole.Arn
  TfStateBucket:
    Value: !Ref StateBucket
  AwsRegion:
    Value: !Ref AWS::Region
  LambdaBoundaryArn:
    Value: !Ref LambdaBoundary
